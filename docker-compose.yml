version: "3.8"

services:
  baserow-connector:
    build:
      context: ./baserow-connector-service
    ports:
      - "8080:8080"
    container_name: baserow-connector-container

  emailjs-connector:
    build:
      context: ./emailjs-connector-service
    environment:
      PORT: 8083
      SERVICE_ID: ${EMAILJS_SERVICE_ID}
      TEMPLATE_ID: ${EMAILJS_TEMPLATE_ID}
      PUBLIC_KEY: ${EMAILJS_PUBLIC_KEY}
      PRIVATE_KEY: ${EMAILJS_PRIVATE_KEY}
    ports:
      - "8083:8083"
    container_name: emailjs-connector-container

  pdf-connector:
    build:
      context: ./pdf-connector-service
    ports:
      - "8082:8082"
    container_name: pdf-connector-container
